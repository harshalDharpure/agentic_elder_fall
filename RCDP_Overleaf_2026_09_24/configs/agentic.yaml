# Confidence-gated agentic pipeline

gate:
  tau_low: 0.30
  tau_high: 0.85
  # calibrated on val set if calibrate: true
  calibrate: true
  cost_fn: 10.0
  cost_fp: 1.0

evidence:
  freefall_g_threshold: 0.5
  stillness_var_threshold: 0.05
  sample_rate_hz: 200

retrieval:
  k: 5
  embedder: sentence-transformers/all-MiniLM-L6-v2
  memory_dir: data/memory
  metric: cosine

llm:
  backend: ollama  # ollama | heuristic
  base_url: http://127.0.0.1:11434
  model: mistral:latest
  temperature: 0.1
  timeout_s: 60
  max_retries: 2
  fallback_heuristic: true

action:
  impact_severe_g: 5.0
  impact_moderate_g: 3.0
  stillness_severe_s: 10.0
  stillness_moderate_s: 3.0
  # simulated responses only (no real emergency calls)
  simulate: true

pipeline:
  ambiguous_adl_codes: [D18, D19]  # stumble, jump — SisFall near-fall ADLs

# Actor–Critic–Judge (ambiguous windows only)
# freeze_label=true: Critic cannot flip fall/ADL; it only grounds rationales and may
# downgrade emergency/notify. That is the Q1-safe critique path.
adjudication:
  enabled: false
  mode: action_critique   # action_critique | actor_only | actor_critic | actor_critic_roleswap
  freeze_label: true
  role_swap: false
  multi_prompt_vote: false
  max_rounds: 1
  tie_break: recall_preserving
  actor_backend: ollama
  critic_backend: heuristic
  allow_action_downgrade: true
  # CRC veto (one-directional fall→ADL). Calibrated per fold on held-out val.
  crc_alpha: 0.05
  crc_delta: 0.1
  crc_method: bernstein
  screen_confident_fall: true
  use_contrastive: false
  k_pos: 3
  k_neg: 3
  veto_threshold: null
  crc_feasible: false