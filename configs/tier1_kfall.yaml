dataset: kfall
raw_dir: data/raw/kfall
processed_dir: data/processed/kfall
sample_rate_hz: 100
window: 90
hop: 10
channels: 3  # accel only (paper default); set 6 to include gyro
num_classes: 36  # 21 ADL + 15 fall types
binary: false
phases: [pre, post, transition]

model:
  in_channels: 3
  conv_channels: 32
  branch_channels: 16
  lstm_hidden: [256, 128]
  attn_heads: 4
  dropout_attn: 0.1
  dropout_fc: 0.5
  use_se: false

train:
  batch_size: 512
  epochs: 200
  lr: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.05
  early_stopping_patience: 20
  num_workers: 4
  seed: 42
  device: cuda
  mixup_alpha: 0.0
  amp: true

splits:
  n_folds: 5
  strategy: subject

checkpoint_dir: checkpoints/kfall

postfall:
  rate_threshold: 1.0  # m/s^2 (paper Algorithm 1)
  stable_samples: 10
