# Binary KFall protocol for external validation of the agentic stack.
# Place approved KFall extract under data/raw/kfall/ then:
#   python scripts/prepare_kfall.py --config configs/tier1_kfall_binary.yaml --phase transition
#   bash scripts/run_kfall_external.sh
dataset: kfall
raw_dir: data/raw/kfall
processed_dir: data/processed/kfall
sample_rate_hz: 100
window: 90
hop: 10
channels: 6  # accel + gyro when available; prepare falls back to 3
num_classes: 2
binary: true
phases: [transition]

model:
  in_channels: 6
  conv_channels: 32
  branch_channels: 16
  lstm_hidden: [256, 128]
  attn_heads: 4
  dropout_attn: 0.1
  dropout_fc: 0.5
  use_se: false

train:
  batch_size: 256
  epochs: 40
  lr: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.05
  early_stopping_patience: 10
  num_workers: 4
  seed: 42
  device: cuda
  mixup_alpha: 0.1
  amp: true
  max_train: 40000
  max_val: 5000
  use_pos_weight: true

splits:
  n_folds: 5
  strategy: subject
  val_fraction: 0.15

checkpoint_dir: checkpoints/kfall

postfall:
  rate_threshold: 1.0
  stable_samples: 10

eval:
  max_test: 1000
  agentic_max_samples: 1000
  calibrate_gate: true
  max_cal: 2000
