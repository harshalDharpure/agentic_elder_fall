[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-fall"
version = "0.1.0"
description = "Confidence-gated agentic fall detection with CNN-LSTM-Attention and LLM reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "scikit-learn>=1.3.0",
  "pandas>=2.0.0",
  "pyyaml>=6.0",
  "tqdm>=4.65.0",
  "requests>=2.31.0",
  "sentence-transformers>=2.2.0",
  "openpyxl>=3.1.0",
  "matplotlib>=3.7.0",
  "einops>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
